<div class="container mt-4">
  <!-- Header Section -->
  <h2 class="text-center">User Food Item Selection</h2>

  <!-- Navigation Buttons for Pagination -->
  <div class="d-flex justify-content-between mb-3">
    <button class="btn btn-outline-primary" (click)="showPrevious()">Previous</button>
    <button class="btn btn-outline-primary" (click)="showNext()">Next</button>
  </div>

  <!-- Table for Food Items -->
  <table class="table table-bordered table-hover">
    <thead>
    <tr>
      <th>Date</th>
      <th>Day</th>
      <th>Food Item</th>
      <th>Total Cost</th>
      <th *ngFor="let member of membersPin">{{ member.pin }}</th>
    </tr>
    </thead>
    <tbody>
    <tr *ngFor="let item of displayedItems">
      <!-- Date and Day -->
      <td>{{ item.date }}</td>
      <td>{{ getDayName(item.date) }}</td>

      <!-- Food Item Input -->
      <td>
        <input
          type="text"
          class="form-control"
          [(ngModel)]="item.foodItem"
          (blur)="saveFoodItemWithDelay(item)"
          placeholder="Enter Food Item"
        />
      </td>

      <!-- Total Cost Input -->
      <td>
        <input
          type="number"
          class="form-control"
          [(ngModel)]="item.amount"
          (blur)="saveFoodItemWithDelay(item)"
          placeholder="Enter Cost"
        />
      </td>

      <!-- Checkboxes for Member Selection -->
      <td *ngFor="let member of membersPin">
        <input
          type="checkbox"
          [(ngModel)]="userCheckboxes[member.pin][item.date]"
          (change)="checkBoxChange(member.pin, item.date)"
        />
      </td>
    </tr>
    </tbody>
  </table>

  <!-- Save Data Button -->
  <div class="text-center mt-4">
    <button class="btn btn-success" (click)="sendPostRequest()">Save Data</button>
  </div>
</div>
